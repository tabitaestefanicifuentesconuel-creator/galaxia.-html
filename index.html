<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxia 4 seg / Expande</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at center, #0f0520 0%, #000000 75%);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <canvas id="galaxia"></canvas>

    <script>
        const lienzo = document.getElementById('galaxia');
        const ctx = lienzo.getContext('2d');

        function ajustarLienzo() {
            lienzo.width = window.innerWidth;
            lienzo.height = window.innerHeight;
        }
        ajustarLienzo();
        window.addEventListener('resize', ajustarLienzo);

        // ⏱️ VELOCIDAD EXACTA: vuelta completa cada 4 segundos
        const config = {
            cantidad: 4000,
            radioMaximo: Math.min(lienzo.width, lienzo.height) / 2.3,
            velocidadGiro: (Math.PI * 2) / 4000, // 4000 milisegundos = 4 segundos
            velocidadExpansion: 0.15,
            colores: ['#ffffff', '#fff176', '#ffcc80', '#ff9800', '#ff5722', '#ffd740', '#82b1ff', '#ea80fc']
        };

        const estrellas = [];
        for(let i = 0; i < config.cantidad; i++){
            const distInicial = Math.random() * config.radioMaximo * 0.3;
            estrellas.push({
                angulo: Math.random() * Math.PI * 2,
                distancia: distInicial,
                distanciaObjetivo: Math.pow(Math.random(), 2.2) * config.radioMaximo,
                tamano: Math.random() * 1.8 + 0.2,
                color: config.colores[Math.floor(Math.random() * config.colores.length)],
                giroExtra: (Math.random() - 0.5) * 0.001,
                parpadeo: Math.random() * Math.PI * 2,
                velParpadeo: Math.random() * 0.2 + 0.08
            });
        }

        function dibujar(){
            ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
            ctx.fillRect(0, 0, lienzo.width, lienzo.height);

            const centroX = lienzo.width / 2;
            const centroY = lienzo.height / 2;

            estrellas.forEach(estrella => {
                estrella.angulo += config.velocidadGiro + estrella.giroExtra;
                if(estrella.distancia < estrella.distanciaObjetivo){
                    estrella.distancia += (estrella.distanciaObjetivo - estrella.distancia) * config.velocidadExpansion;
                }
                estrella.parpadeo += estrella.velParpadeo;

                const x = centroX + Math.cos(estrella.angulo) * estrella.distancia;
                const y = centroY + Math.sin(estrella.angulo) * estrella.distancia;

                const brillo = 0.35 + Math.abs(Math.sin(estrella.parpadeo)) * 0.65;

                ctx.beginPath();
                ctx.arc(x, y, estrella.tamano, 0, Math.PI * 2);
                ctx.globalAlpha = brillo;
                ctx.fillStyle = estrella.color;
                ctx.shadowBlur = 6 + brillo * 15;
                ctx.shadowColor = estrella.color;
                ctx.fill();
                ctx.globalAlpha = 1;
            });

            requestAnimationFrame(dibujar);
        }

        dibujar();
    </script>
</body>
</html>
